name: Auditoria Semanal

on:
  schedule:
    - cron: "0 19 * * 2" # martes 19:00 UTC = 15:00/16:00 en Chile
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auditoria:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Misma cache que el workflow del scraper: la corrida semanal además
      # la mantiene viva (GitHub la borra tras 7 días sin uso).
      - name: Construir imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: carflip:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Docker Scout exige sesión en Docker Hub, incluso para imágenes locales
      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Instalar Docker Scout
        run: curl -fsSL https://raw.githubusercontent.com/docker/scout-cli/main/install.sh | sh -s --

      - uses: astral-sh/setup-uv@v6

      # Falla si hay vulnerabilidades en paquetes de PyPI (el gate del test)
      # y deja el escaneo completo en reports/auditoria_imagen.json.
      - name: Ejecutar tests de auditoría
        run: uv run pytest -m integration tests/test_auditoria_imagen.py

      - name: Publicar reporte
        if: always() && hashFiles('reports/auditoria_imagen.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-imagen
          path: reports/auditoria_imagen.json

      # Actualiza un único Security Advisory en borrador (nunca se publica) en vez
      # de un issue público: el repo es público y un issue expondría a cualquiera
      # qué paquetes son vulnerables y con qué severidad. Un draft solo lo ven
      # administradores/security managers del repo y quienes se agreguen como
      # colaboradores del advisory.
      #
      # GITHUB_TOKEN no puede usarse aquí: "repository-advisories" no existe entre
      # los permisos otorgables a GITHUB_TOKEN en un workflow, así que se requiere
      # un fine-grained PAT con permiso "Repository security advisories: write"
      # sobre este repo, guardado como secret ADVISORY_TOKEN.
      - name: Actualizar Security Advisory
        if: always() && hashFiles('reports/auditoria_imagen.json') != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ADVISORY_TOKEN }}
          script: |
            const fs = require('fs');
            const reporte = JSON.parse(fs.readFileSync('reports/auditoria_imagen.json', 'utf8'));

            const TITULO = 'Auditoría de dependencias: módulos por actualizar';

            // Ecosistemas soportados por la API de Security Advisories; lo que no
            // calza (paquetes deb/apk de la imagen base, "generic" de Playwright)
            // cae en "other".
            const ECOSISTEMAS = {
              pypi: 'pip', npm: 'npm', cargo: 'rust', golang: 'go', go: 'go',
              maven: 'maven', nuget: 'nuget', composer: 'composer', gem: 'rubygems',
            };
            const ORDEN_SEVERIDAD = ['critical', 'high', 'medium', 'low'];

            // Agrupa por módulo; el reporte viene ordenado por severidad,
            // así que la primera aparición trae la severidad máxima.
            const modulos = new Map();
            for (const v of reporte.vulnerabilidades) {
              const clave = `${v.paquete}@${v.version}`;
              const m = modulos.get(clave) ?? {
                paquete: v.paquete, version: v.version, tipo: v.tipo,
                severidad: v.severidad, vulns: 0, fix: null,
              };
              m.vulns += 1;
              m.fix = m.fix ?? v.fix;
              modulos.set(clave, m);
            }

            const lista = [...modulos.values()];
            const porActualizar = lista.filter((m) => m.fix).length;
            const sinFix = lista.length - porActualizar;

            const tabla = lista.length
              ? [
                  '| Módulo | Versión | Ecosistema | Severidad máx. | Vulns | Fix |',
                  '|---|---|---|---|---|---|',
                  ...lista.map((m) => `| ${m.paquete} | ${m.version} | ${m.tipo} | ${m.severidad} | ${m.vulns} | ${m.fix ?? '—'} |`),
                ].join('\n')
              : 'Sin vulnerabilidades detectadas.';

            const corrida = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const severidadMaxima = ORDEN_SEVERIDAD.find((s) => lista.some((m) => m.severidad === s)) ?? null;

            const vulnerabilities = lista.length
              ? lista.map((m) => ({
                  package: { ecosystem: ECOSISTEMAS[m.tipo] ?? 'other', name: m.paquete },
                  vulnerable_version_range: `<= ${m.version}`,
                  patched_versions: m.fix ?? undefined,
                }))
              : [{ package: { ecosystem: 'other', name: reporte.imagen }, vulnerable_version_range: '*' }];

            const cuerpo = {
              summary: TITULO,
              description: [
                `Auditoría de \`${reporte.imagen}\` con Docker Scout (\`tests/test_auditoria_imagen.py\`), generada ${reporte.generado}.`,
                '',
                `**Módulos por actualizar (con fix disponible): ${porActualizar}**`,
                `Módulos vulnerables sin fix: ${sinFix} · Vulnerabilidades totales: ${reporte.total}`,
                '',
                tabla,
                '',
                `Reporte completo en el artifact [\`auditoria-imagen\`](${corrida}) de la corrida.`,
              ].join('\n'),
              vulnerabilities,
              severity: severidadMaxima,
            };

            const { data: existentes } = await github.request('GET /repos/{owner}/{repo}/security-advisories', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'draft',
              per_page: 100,
            });
            const previo = existentes.find((a) => a.summary === TITULO);

            const ghsaId = previo
              ? previo.ghsa_id
              : (await github.request('POST /repos/{owner}/{repo}/security-advisories', {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ...cuerpo,
                })).data.ghsa_id;

            // El PATCH corre siempre: si el draft ya existía, sincroniza el
            // contenido; si se acaba de crear, agrega el colaborador (la API de
            // creación no acepta collaborating_users).
            await github.request('PATCH /repos/{owner}/{repo}/security-advisories/{ghsa_id}', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              ghsa_id: ghsaId,
              ...cuerpo,
              collaborating_users: ['DiegoPyLL'],
            });
